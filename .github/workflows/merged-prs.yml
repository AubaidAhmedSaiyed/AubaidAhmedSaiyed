name: Update Merged PRs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Update merged PRs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const username = "AubaidAhmedSaiyed";

            const { data } = await github.rest.search.issuesAndPullRequests({
              q: `is:pr is:merged author:${username}`,
              sort: "updated",
              order: "desc",
              per_page: 10
            });

            const prs = data.items.map(pr =>
              `- [${pr.title}](${pr.html_url})`
            ).join("\n");

            const readme = fs.readFileSync("README.md", "utf8");

            const updated = readme.replace(
              /<!--START_MERGED_PRS-->[\\s\\S]*?<!--END_MERGED_PRS-->/,
              `<!--START_MERGED_PRS-->\n${prs}\n<!--END_MERGED_PRS-->`
            );

            fs.writeFileSync("README.md", updated);
