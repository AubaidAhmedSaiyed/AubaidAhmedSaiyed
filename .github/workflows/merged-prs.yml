name: Update Merged PRs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get merged PRs
        id: prs
        uses: actions/github-script@v7
        with:
          script: |
            const username = "AubaidAhmedSaiyed";

            const { data } = await github.rest.search.issuesAndPullRequests({
              q: `is:pr is:merged author:${username}`,
              sort: "created",
              order: "desc",
              per_page: 10
            });

            console.log(`Found ${data.total_count} merged PRs`);

            const prs = data.items.map(pr =>
              `- [${pr.title}](${pr.html_url})`
            ).join("\n");

            core.setOutput("prs", prs);

      - name: Update README
        env:
          PRS: ${{ steps.prs.outputs.prs }}
        run: |
          python - <<'PY'
          import os
          import re

          with open("README.md", "r", encoding="utf-8") as f:
              readme = f.read()

          prs = os.environ.get("PRS", "")

          replacement = f"""<!--START_MERGED_PRS-->
          {prs}
          <!--END_MERGED_PRS-->"""

          updated = re.sub(
              r"<!--START_MERGED_PRS-->.*?<!--END_MERGED_PRS-->",
              replacement,
              readme,
              flags=re.DOTALL
          )

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(updated)
          PY

      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update merged PRs"
            git push
          fi
